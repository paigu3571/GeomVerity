# SPDX-License-Identifier: MPL-2.0
id: DRAFT_88e437765ce8
title: 电气竖井不应与电梯井、其他专业管道井共用同一竖井
approved: true
approved_by: 张田
clauses:
- code: GB 55024-2022
  article: 6.2.8第1款
  text: 电气竖井不应与电梯井、其他专业管道井共用同一竖井。
  strength: 应
  code_version: '2022'
applies_to:
- ELECTRICAL_SHAFT
check:
  when:
    predicate: space_use_in
    values:
    - ELECTRICAL_SHAFT
  require:
    predicate: shaft_shared_with
    values:
    - ELEVATOR_SHAFT
    - OTHER_SERVICE_SHAFT
    expect: false
on_missing: 缺少电气竖井共井用途资料时，应补充后可判定；不推定通过。
scope: 仅依据空间用途及共井用途做条件初查，不涉及防火、构造等其他要求；缺资料不推定通过。
rule_version: '1'
