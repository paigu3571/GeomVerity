id: LIGHT-DEMO-001
title: 灯具布置候选（演示规则，非照度设计）
rule_version: '0.1.0'
approved: true
approved_by: 张田（演示参数授权）
applies_to: [SUBSTATION, DISTRIBUTION_ROOM]
strategy: rectangular_grid
min_rectangle_ratio: 0.95
max_spacing_m: 3.0
