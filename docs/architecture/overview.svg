<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><style>text{font-family:Microsoft YaHei,Arial;fill:#183949}.t{font-size:25px;font-weight:bold}.h{font-size:20px;font-weight:bold;fill:#147b80}.b{font-size:16px}.s{font-size:14px}</style><rect width="1000" height="430" fill="#fff"/><text class="t" x="35" y="42">GeomVerity · 混合架构与工程证据</text><g fill="#e6f2f3"><rect x="35" y="75" width="215" height="130" rx="12"/><rect x="273" y="75" width="215" height="130" rx="12"/><rect x="511" y="75" width="215" height="130" rx="12"/><rect x="749" y="75" width="215" height="130" rx="12"/></g><text class="h" x="52" y="110">L1—L2</text><text class="b" x="52" y="144">图元 / 几何解析</text><text class="s" x="52" y="177">确定性代码，保留来源</text><text class="h" x="290" y="110">L3</text><text class="b" x="290" y="144">空间拓扑 / 术语</text><text class="s" x="290" y="177">代码 + LLM提议 + 人批准</text><text class="h" x="528" y="110">L4</text><text class="b" x="528" y="144">检查 / 计算 / 布置</text><text class="s" x="528" y="177">代码执行，模型起草协作</text><text class="h" x="766" y="110">Decision</text><text class="b" x="766" y="144">依赖 / 版本 / 签字</text><text class="s" x="766" y="177">来源可核对，变更会失效</text><g stroke="#147b80" stroke-width="2"><path d="M252 140h17m-6-5l6 5-6 5M490 140h17m-6-5l6 5-6 5M728 140h17m-6-5l6 5-6 5" fill="none"/></g><rect x="35" y="235" width="929" height="65" fill="#183949" rx="10"/><text x="55" y="262" style="fill:white;font-size:18px">自动协作：读懂图 → 跟住变化 → 原确认重核 → 通知与生成候选</text><text x="55" y="286" style="fill:white;font-size:14px">通知由LLM起草、引用校验后交工程师签字；本版输出可复制文件</text><rect x="35" y="320" width="929" height="65" fill="#e6f2f3" rx="10"/><text class="b" x="55" y="348">打开AI盲盒：数据回源图 / 规则回条款版本 / AI回请求、校验与审批</text><text class="s" x="55" y="373">插件、CLI、SDK、MCP共用结构化结果；Viewer展示，Desktop为可选实验壳</text><text class="s" x="35" y="415">L1—L3原扫描不改；未知用途与资料缺口不补成确定结论</text></svg>
