<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CAD工程语义 · 可追溯查看器</title>
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages/drawing.css" />
  </head>
  <body class="drawing-view">
    <main>
      <section class="left">
        <div class="bar" aria-label="图面工具">
          <button id="before">识别前</button
          ><button id="after" class="on">识别后</button
          ><button id="all">全图</button><button id="back">电气场景</button
          ><button id="changes">变更模式</button
          ><button id="allChanges">全部变更</button
          ><button id="listToggle">变更清单</button
          ><button id="issues">图纸问题</button
          ><button id="focusCanvas" aria-pressed="false">收起详情</button>
          <details class="layer-menu">
            <summary>图层</summary>
            <label><input type="checkbox" id="layerOld" />旧门／旧灯对照（已删除，不是新版）</label>
            <label><input type="checkbox" id="layerGrid" />背景网格</label>
            <label
              ><input type="checkbox" id="layerSource" checked />原图线条</label
            ><label
              ><input
                type="checkbox"
                id="layerSemantic"
                checked
              />识别对象</label
            ><label
              ><input
                type="checkbox"
                id="layerChanges"
                checked
              />变化轮廓</label
            >
          </details>
          <button id="toggleLights" aria-pressed="false">隐藏实验灯具</button>
          <button id="themeToggle" aria-pressed="false">浅色画布</button
          ><button id="drawingHelp" aria-label="图面帮助">?</button
          ><input
            id="search"
            aria-label="搜索房名"
            placeholder="搜索房名"
          /><select id="rooms" aria-label="选择房间"></select>
        </div>
        <section id="changeList" class="change-list" hidden>
          <b>逐项核对变更</b>
          <div id="changeTimes" class="check-time"></div>
          <div class="check-actions">
            <select id="listFilter" aria-label="筛选变更清单">
              <option value="all">全部核对项</option>
              <option value="rooms" selected>房间</option>
              <option value="source">墙、门、窗等源对象</option>
              <option value="derived">派生围合差异</option></select
            ><span id="listCount"></span>
          </div>
          <div id="answerComparison"></div>
          <div id="changeRows"></div>
        </section>
        <div class="canvas">
          <svg
            id="drawing"
            class="changes-room-only"
            aria-label="真实CAD语义图"
          >
            <defs>
              <pattern
                id="review"
                width="1"
                height="1"
                patternUnits="userSpaceOnUse"
                patternTransform="rotate(45)"
              >
                <path d="M0,0V1" stroke="var(--text-body)" stroke-width=".07" />
              </pattern>
            </defs>
            <g class="gray">__GRAY__</g>
            <g class="semantic">__SVG__</g>
            <g id="change-clouds" pointer-events="none"></g>
            <g id="focus" pointer-events="none"></g>
          </svg>
          <div class="north"><strong>↑</strong> WCS +Y<br />保持CAD方向</div>

          <details class="legend" open>
            <summary>图例</summary>
            <div class="legend-content">
              <span><i class="u1-view-inline-1"></i>变电所</span
              ><span><i class="u1-view-inline-2"></i>配电室</span
              ><span><i class="u1-view-inline-3"></i>弱电房间</span
              ><span><i class="u1-view-inline-4"></i>电气竖井</span
              ><span><i class="u1-view-inline-5"></i>门的位置</span
              ><span><i class="u1-view-inline-6"></i>灯具〔实验〕</span
              ><span><i class="legend-cloud"></i>洋红云线：改动范围</span
              ><span><i class="legend-added"></i>新增</span
              ><span><i class="legend-changed"></i>改动</span
              ><span><i class="legend-deleted"></i>删除或失效</span
              ><span><i class="legend-issue" aria-hidden="true">×</i>红叉圆圈：图纸识别缺口，点击查看原因；不表示设计违规</span
              ><span>斜线＝软件识别区域</span
              ><span>点图例对应的对象，在右侧查看说明</span>
            </div>
          </details>
        </div>
      </section>
      <div class="object-panel" id="objectPanel">
        <div class="object-panel-head">
          <strong>对象与依据</strong
          ><button id="closeObject" aria-label="收起对象详情">收起</button>
        </div>
        <aside class="panel" id="panel"></aside>
      </div>
    </main>
    <dialog id="drawingHelpDialog" aria-labelledby="drawingHelpTitle">
      <h3 id="drawingHelpTitle">图面操作与覆盖范围</h3>
      <p>
        滚轮缩放，拖动平移；点房间查规则、点灯具查来源、点邻房看隔墙。图纸保持
        CAD 方向，查看器不修改源图。
      </p>
      <p>
        识别前/后切换图元覆盖；图层控制只影响显示。变更、影响和旧确认均只展示核心已有结果，不代替工程师核对。
      </p>
      <div id="foot" class="foot"></div>
      <button id="closeDrawingHelp">关闭帮助</button>
    </dialog>
    <script id="data" type="application/json">
      __PAYLOAD__
    </script>
    __GV_ICON_SPRITE__
    <script src="assets/js/components.js"></script>
    <script src="assets/js/pages/view-core.js"></script>
    <script src="assets/js/pages/view-objects.js"></script>
    <script src="assets/js/pages/view-changes.js"></script>
    <script src="assets/js/pages/view-events.js"></script>
  </body>
</html>
